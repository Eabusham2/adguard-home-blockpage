services:
  blockpage:
    build: .
    container_name: adguard-home-blockpage
    restart: unless-stopped
    network_mode: host
    environment:
      AGH_URL: "${AGH_URL}"
      AGH_USERNAME: "${AGH_USERNAME}"
      AGH_PASSWORD: "${AGH_PASSWORD}"
      PORT: "80"
      UNBLOCK_ALLOWED_NETWORKS: "${UNBLOCK_ALLOWED_NETWORKS:-192.168.50.0/24,127.0.0.0/8,::1/128,fc00::/7,fe80::/10}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cgroup: host
    volumes:
      - /proc:/host-proc:ro
      - /sys/fs/cgroup:/host-cgroup:ro
      - unblock_state:/state
    mem_limit: 128m
    pids_limit: 32
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  unblock_state: {}
