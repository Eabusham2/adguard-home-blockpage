services:
  blockpage:
    build: .
    container_name: adguard-home-blockpage
    restart: unless-stopped
    network_mode: host
    environment:
      AGH_URL: "${AGH_URL:?Set AGH_URL to your AdGuard API base URL}"
      AGH_USERNAME: "${AGH_USERNAME:-}"
      AGH_PASSWORD: "${AGH_PASSWORD:-}"
      PORT: "80"
      UNBLOCK_ALLOWED_NETWORKS: "${UNBLOCK_ALLOWED_NETWORKS:?Set UNBLOCK_ALLOWED_NETWORKS to trusted administrator addresses or networks}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cgroup: host
    volumes:
      - /proc:/host-proc:ro
      - /sys/fs/cgroup:/host-cgroup:ro
      - unblock_state:/state
    mem_limit: 128m
    pids_limit: 32
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  unblock_state: {}
