services:
  blockpage:
    image: python:3.13-alpine
    pull_policy: never
    container_name: adguard-home-blockpage
    restart: unless-stopped
    network_mode: host

    # Keep the old DNS fallback for downloading code during AdGuard outages.
    dns:
      - 192.168.50.133
      - 1.1.1.1

    # Read AdGuard's existing query logs and configuration, without modifying them.
    volumes_from:
      - "container:adguard-asus:ro"

    # Pin the verified v0.9.15 source; retry all four downloads if GitHub/DNS fails.
    # Only this block-page container is changed; AdGuard is never restarted.
    command:
      - sh
      - -ec
      - |
        echo "Starting AdGuard block page..."
        SRC=https://raw.githubusercontent.com/Eabusham2/adguard-home-blockpage/8cbc283a840065d04f671aa86bf8d0fb84aa467b
        until wget -q -T 15 -O /tmp/app.py "$$SRC/app.py" \
          && wget -q -T 15 -O /tmp/unblock.py "$$SRC/unblock.py" \
          && wget -q -T 15 -O /tmp/memory_guard.py "$$SRC/memory_guard.py" \
          && wget -q -T 15 -O /tmp/unblock_ui.py "$$SRC/unblock_ui.py"; do
          echo "DNS/GitHub unavailable - retrying in 5 seconds..."
          sleep 5
        done
        python -m py_compile /tmp/app.py /tmp/unblock.py /tmp/memory_guard.py /tmp/unblock_ui.py
        echo "Downloaded and verified v0.9.15 - starting..."
        exec python -u /tmp/app.py

    environment:
      AGH_URL: "${AGH_URL}"
      AGH_USERNAME: "${AGH_USERNAME}"
      AGH_PASSWORD: "${AGH_PASSWORD}"
      AGH_QUERYLOG_FILE: "/opt/adguardhome/work/data/querylog.json"
      AGH_CONFIG_FILE: "/opt/adguardhome/conf/AdGuardHome.yaml"
      UNBLOCK_ALLOWED_NETWORKS: "${UNBLOCK_ALLOWED_NETWORKS:-192.168.50.0/24,127.0.0.0/8,::1/128,fc00::/7,fe80::/10}"
      UNBLOCK_STATE_DIR: "/state"
      PORT: "80"

    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

    # Conservative memory-check access; no Docker socket or AdGuard writes.
    cgroup: host
    volumes:
      - /proc:/host-proc:ro
      - /sys/fs/cgroup:/host-cgroup:ro
      - unblock_state:/state

    mem_limit: 128m
    pids_limit: 32
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - DAC_READ_SEARCH

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  unblock_state: {}
