services:
  blockpage:
    image: python:3.13-alpine
    container_name: adguard-home-blockpage
    restart: unless-stopped
    network_mode: host
    # Read AdGuard's existing work/config mounts directly, but never write to them.
    volumes_from:
      - "container:adguard-asus:ro"
    command:
      - sh
      - -c
      - wget -qO /tmp/app.py "https://raw.githubusercontent.com/Eabusham2/adguard-home-blockpage/main/app.py?cb=$$(date +%s)" && python /tmp/app.py
    environment:
      AGH_URL: "${AGH_URL}"
      AGH_USERNAME: "${AGH_USERNAME}"
      AGH_PASSWORD: "${AGH_PASSWORD}"
      AGH_QUERYLOG_FILE: "/opt/adguardhome/work/data/querylog.json"
      AGH_CONFIG_FILE: "/opt/adguardhome/conf/AdGuardHome.yaml"
      PORT: "80"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - DAC_READ_SEARCH
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
